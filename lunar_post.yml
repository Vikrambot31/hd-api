name: Daily Lunar Post

on:
  schedule:
    # GitHub cron uses UTC. These two runs cover 07:00 Kyiv in summer and winter.
    # The Python script sends only when Europe/Kyiv time is exactly 07:00.
    - cron: '0 4 * * *'
    - cron: '0 5 * * *'

  workflow_dispatch:

jobs:
  send-lunar-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send daily lunar post to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python lunar_bot.py