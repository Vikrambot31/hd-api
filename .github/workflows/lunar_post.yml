name: Daily Lunar Post

on:
  schedule:
    # GitHub cron uses UTC. 03:00 UTC = 05:00 Kyiv in winter / 06:00 Kyiv in summer.
    - cron: '0 3 * * *'

  workflow_dispatch:

jobs:
  send-lunar-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyswisseph

      - name: Send daily lunar post to Telegram
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python lunar_bot.py

      - name: Save sent-date state to repo
        run: |
          git config user.name "lunar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add last_sent.txt
          git diff --staged --quiet || git commit -m "chore: lunar post sent $(date -u +%Y-%m-%d)"
          git push
